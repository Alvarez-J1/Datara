spring:
  datasource:
    url: ${DATARA_DB_URL:jdbc:postgresql://localhost:5432/datara}
    username: ${DATARA_DB_USERNAME:datara}
    password: ${DATARA_DB_PASSWORD:datara}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DATARA_DB_MAX_POOL_SIZE:3}
      minimum-idle: ${DATARA_DB_MIN_IDLE:0}
      connection-timeout: ${DATARA_DB_CONNECTION_TIMEOUT_MS:10000}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${DATARA_JPA_DDL_AUTO:none}
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: ${DATARA_FLYWAY_ENABLED:true}
