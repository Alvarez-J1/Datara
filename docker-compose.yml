services:
  postgres:
    image: postgres:16
    container_name: datara-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: datara
      POSTGRES_USER: datara
      POSTGRES_PASSWORD: datara
    volumes:
      - datara-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datara -d datara"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  datara-postgres-data:
